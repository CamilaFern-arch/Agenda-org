<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mi Agenda de Bienestar</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Agenda">
<link rel="apple-touch-icon" href="https://img.icons8.com/fluency/180/moon-star.png">
<link rel="icon" type="image/png" href="https://img.icons8.com/fluency/48/moon-star.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --rose: #e8a4a4;
    --rose-deep: #c47878;
    --rose-light: #f5d5d5;
    --cream: #fdf0f0;
    --lavender: #d4b8e0;
    --sky: #b8d4e8;
    --text: #5a3535;
    --text-light: #9e6e6e;
    --white: #fff9f9;
    --card: rgba(255,249,249,0.85);
    --shadow: 0 4px 24px rgba(196,120,120,0.13);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── SPLASH SCREEN ── */
  #splash {
    position: fixed; inset: 0; z-index: 999;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: linear-gradient(135deg, #f9d4e8 0%, #e8d4f9 30%, #d4e8f9 60%, #f9e8d4 100%);
    transition: opacity .6s ease;
  }
  #splash.hide { opacity: 0; pointer-events: none; }

  .splash-orb {
    width: 160px; height: 160px;
    border-radius: 50%;
    background: white;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    font-size: 80px;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }

  .btn-enter {
    background: var(--rose-deep);
    color: white; border: none; border-radius: 50px;
    padding: 14px 40px; font-size: 1rem;
    font-weight: 500; cursor: pointer;
    box-shadow: 0 4px 20px rgba(196,120,120,0.4);
  }

  /* ── APP SHELL ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  #app.show { display: flex; }

  header {
    background: var(--white);
    border-bottom: 1px solid var(--rose-light);
    padding: 15px 20px;
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: 600; }
  .header-date { font-size: .85rem; color: var(--text-light); }

  /* ── NAVIGATION ── */
  nav {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    background: var(--white);
    border-top: 1px solid var(--rose-light);
    display: flex; padding-bottom: env(safe-area-inset-bottom, 10px);
  }
  .nav-btn {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; padding: 10px;
    background: none; border: none; color: var(--text-light);
    font-size: .7rem; transition: 0.3s;
  }
  .nav-btn.active { color: var(--rose-deep); }
  .nav-btn svg { width: 22px; height: 22px; margin-bottom: 4px; }

  /* ── SECTIONS & CARDS ── */
  main { flex: 1; padding: 20px 16px 100px; max-width: 500px; margin: 0 auto; width: 100%; }
  .section { display: none; }
  .section.active { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }

  .card {
    background: var(--card); border-radius: 20px;
    padding: 20px; margin-bottom: 16px;
    box-shadow: var(--shadow); border: 1px solid rgba(232,164,164,0.1);
  }
  .card-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem; font-weight: 600; margin-bottom: 15px;
  }

  /* ── INPUTS ── */
  .note-area {
    width: 100%; border: 1.5px solid var(--rose-light);
    border-radius: 15px; padding: 12px; font-family: inherit;
    font-size: 0.95rem; resize: none; outline: none;
  }
  .task-input {
    flex: 1; border: 1.5px solid var(--rose-light);
    border-radius: 12px; padding: 10px; outline: none;
  }
  .btn-add {
    background: var(--rose-deep); color: white;
    border: none; border-radius: 12px; padding: 0 15px; cursor: pointer;
  }

  /* ── ELEMENTS ── */
  .task-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px; background: white; border-radius: 12px; margin-bottom: 8px;
  }
  .task-item.done { opacity: 0.5; text-decoration: line-through; }
  .mood-row { display: flex; justify-content: space-around; margin: 10px 0; }
  .mood-btn { font-size: 1.8rem; background: none; border: 2px solid transparent; border-radius: 50%; cursor: pointer; transition: 0.2s; }
  .mood-btn.selected { border-color: var(--rose-deep); background: var(--rose-light); }

  .days-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
  .day-chip {
    min-width: 55px; padding: 10px; border-radius: 15px;
    background: white; border: 1px solid var(--rose-light);
    text-align: center; cursor: pointer;
  }
  .day-chip.active { background: var(--rose-deep); color: white; }

  #toast {
    position: fixed; bottom: 85px; left: 50%; transform: translateX(-50%);
    background: #333; color: white; padding: 8px 20px; border-radius: 20px;
    font-size: 0.8rem; opacity: 0; transition: 0.3s; z-index: 1000;
  }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-orb">🌙</div>
  <h1 style="font-family:'Cormorant Garamond'; font-size: 2.5rem;">Mi Agenda</h1>
  <p style="margin-bottom: 30px; color: var(--text-light);">Agradecimiento y Bienestar</p>
  <button class="btn-enter" onclick="enterApp()">Comenzar ✨</button>
</div>

<div id="app">
  <header>
    <div class="header-brand">☀️ Mi Agenda</div>
    <div class="header-date" id="headerDate"></div>
  </header>

  <main>
    <section class="section active" id="sec-home">
      <div class="card">
        <div class="card-title">Agradecimiento del día 🌿</div>
        <textarea class="note-area" id="gratitude" placeholder="Hoy agradezco por..." rows="3"></textarea>
      </div>

      <div class="card">
        <div class="card-title">¿Cómo te sientes?</div>
        <div class="mood-row">
          <button class="mood-btn" onclick="setMood('😊', this)">😊</button>
          <button class="mood-btn" onclick="setMood('✨', this)">✨</button>
          <button class="mood-btn" onclick="setMood('🌿', this)">🌿</button>
          <button class="mood-btn" onclick="setMood('☁️', this)">☁️</button>
          <button class="mood-btn" onclick="setMood('😴', this)">😴</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">Resumen de la semana</div>
        <div id="weekSummary" style="font-size: 0.9rem; color: var(--text-light);">
          Cargando tus progresos...
        </div>
      </div>
    </section>

    <section class="section" id="sec-week">
      <div class="days-strip" id="daysStrip"></div>
      
      <div class="card">
        <div class="card-title" id="selectedDayTitle">Tareas</div>
        <div style="display:flex; gap:8px; margin-bottom:15px;">
          <input class="task-input" id="taskInput" placeholder="Nueva tarea o recordatorio...">
          <button class="btn-add" onclick="addTask()">+</button>
        </div>
        <div id="taskList"></div>
      </div>

      <div class="card">
        <div class="card-title">Notas Semanales</div>
        <textarea class="note-area" id="weekNotes" placeholder="Cosas importantes para recordar esta semana..." rows="4"></textarea>
      </div>
    </section>

    <section class="section" id="sec-reminders">
      <div class="card">
        <div class="card-title">Alertas y Avisos</div>
        <div style="display:flex; flex-direction:column; gap:10px;">
          <input type="time" id="remTime" class="task-input">
          <input type="text" id="remText" class="task-input" placeholder="¿Qué debo recordarte?">
          <button class="btn-add" style="padding:10px" onclick="addReminder()">Guardar Alerta 🔔</button>
        </div>
      </div>
      <div id="reminderList"></div>
    </section>
  </main>

  <nav>
    <button class="nav-btn active" onclick="switchTab('home', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
      Inicio
    </button>
    <button class="nav-btn" onclick="switchTab('week', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>
      Semana
    </button>
    <button class="nav-btn" onclick="switchTab('reminders', this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      Alertas
    </button>
  </nav>
</div>

<div id="toast"></div>

<script>
let state = {
  tasks: {},
  moods: {},
  gratitude: {},
  reminders: [],
  weekNotes: ""
};

const TODAY = new Date().toISOString().split('T')[0];
let selectedDay = TODAY;

function save() { localStorage.setItem('agenda_bienestar_v1', JSON.stringify(state)); }
function load() {
  const saved = localStorage.getItem('agenda_bienestar_v1');
  if(saved) state = JSON.parse(saved);
}

function enterApp() {
  document.getElementById('splash').classList.add('hide');
  document.getElementById('app').classList.add('show');
  init();
}

function init() {
  load();
  renderHeader();
  renderWeekStrip();
  renderTasks();
  renderReminders();
  document.getElementById('gratitude').value = state.gratitude[TODAY] || "";
  document.getElementById('weekNotes').value = state.weekNotes || "";
  
  // Guardado automático de textos
  document.getElementById('gratitude').oninput = (e) => { state.gratitude[TODAY] = e.target.value; save(); };
  document.getElementById('weekNotes').oninput = (e) => { state.weekNotes = e.target.value; save(); };
}

function renderHeader() {
  const options = { weekday: 'long', day: 'numeric', month: 'long' };
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('es-ES', options);
}

function renderWeekStrip() {
  const strip = document.getElementById('daysStrip');
  strip.innerHTML = '';
  const now = new Date();
  for(let i = -2; i < 5; i++) {
    const d = new Date();
    d.setDate(now.getDate() + i);
    const k = d.toISOString().split('T')[0];
    const chip = document.createElement('div');
    chip.className = `day-chip ${k === selectedDay ? 'active' : ''}`;
    chip.innerHTML = `<div style="font-size:0.7rem">${d.toLocaleDateString('es-ES', {weekday:'short'})}</div><div>${d.getDate()}</div>`;
    chip.onclick = () => { selectedDay = k; renderWeekStrip(); renderTasks(); };
    strip.appendChild(chip);
  }
}

function addTask() {
  const input = document.getElementById('taskInput');
  if(!input.value.trim()) return;
  if(!state.tasks[selectedDay]) state.tasks[selectedDay] = [];
  state.tasks[selectedDay].push({ id: Date.now(), text: input.value, done: false });
  input.value = '';
  save(); renderTasks();
}

function renderTasks() {
  const list = document.getElementById('taskList');
  const dayTasks = state.tasks[selectedDay] || [];
  document.getElementById('selectedDayTitle').textContent = selectedDay === TODAY ? "Tareas de hoy" : "Tareas del " + selectedDay;
  
  if(dayTasks.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:#ccc; font-size:0.9rem">No hay tareas para este día</p>';
    return;
  }

  list.innerHTML = dayTasks.map(t => `
    <div class="task-item ${t.done ? 'done' : ''}">
      <input type="checkbox" ${t.done ? 'checked' : ''} onclick="toggleTask(${t.id})">
      <span style="flex:1">${t.text}</span>
      <span onclick="deleteTask(${t.id})" style="color:var(--rose-deep); cursor:pointer">✕</span>
    </div>
  `).join('');
}

function toggleTask(id) {
  state.tasks[selectedDay] = state.tasks[selectedDay].map(t => t.id === id ? {...t, done: !t.done} : t);
  save(); renderTasks();
}

function deleteTask(id) {
  state.tasks[selectedDay] = state.tasks[selectedDay].filter(t => t.id !== id);
  save(); renderTasks();
}

function setMood(emoji, btn) {
  state.moods[TODAY] = emoji;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  save();
  showToast("Estado de ánimo guardado");
}

function addReminder() {
  const time = document.getElementById('remTime').value;
  const text = document.getElementById('remText').value;
  if(!time || !text) return;
  state.reminders.push({ id: Date.now(), time, text });
  save(); renderReminders();
  showToast("Recordatorio guardado");
}

function renderReminders() {
  const list = document.getElementById('reminderList');
  list.innerHTML = state.reminders.map(r => `
    <div class="card" style="margin-bottom:10px; display:flex; justify-content:space-between; align-items:center">
      <div><strong>${r.time}</strong> - ${r.text}</div>
      <span onclick="deleteReminder(${r.id})" style="cursor:pointer">✕</span>
    </div>
  `).join('');
}

function deleteReminder(id) {
  state.reminders = state.reminders.filter(r => r.id !== id);
  save(); renderReminders();
}

function switchTab(tab, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + tab).classList.add('active');
  btn.classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2000);
}

// Auto-entrar si ya se ha usado
if(localStorage.getItem('agenda_bienestar_v1')) {
  setTimeout(enterApp, 500);
}
</script>
</body>
</html>
