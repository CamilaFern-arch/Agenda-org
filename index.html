<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Mi Agenda</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/1164/1164951.png">
<link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/1164/1164951.png">

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --rose: #e8a4a4;
    --rose-deep: #c47878;
    --rose-light: #f5d5d5;
    --cream: #fdf0f0;
    --text: #5a3535;
    --text-light: #9e6e6e;
    --white: #fff9f9;
    --card: rgba(255,249,249,0.9);
    --shadow: 0 4px 20px rgba(196,120,120,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 80px;
  }

  header {
    background: var(--white);
    padding: 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid var(--rose-light);
    position: sticky; top: 0; z-index: 100;
  }

  .header-brand { font-family: 'Cormorant Garamond', serif; font-size: 1.6rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .header-date { font-size: 0.8rem; color: var(--text-light); text-transform: capitalize; }

  main { padding: 20px 16px; max-width: 500px; margin: 0 auto; }
  
  .section { display: none; animation: fadeIn 0.3s ease; }
  .section.active { display: block; }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }

  .card {
    background: var(--card); border-radius: 20px;
    padding: 20px; margin-bottom: 16px;
    box-shadow: var(--shadow); border: 1px solid rgba(232,164,164,0.1);
  }

  .card-title { font-family: 'Cormorant Garamond', serif; font-size: 1.3rem; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }

  .note-area {
    width: 100%; border: 1px solid var(--rose-light);
    border-radius: 15px; padding: 12px; font-family: inherit;
    font-size: 1rem; resize: none; outline: none; background: var(--white);
  }

  .mood-row { display: flex; justify-content: space-between; margin: 10px 0; }
  .mood-btn { font-size: 1.8rem; background: none; border: 2px solid transparent; border-radius: 50%; cursor: pointer; transition: 0.2s; padding: 5px; }
  .mood-btn.selected { border-color: var(--rose-deep); background: var(--rose-light); }

  .days-strip { display: flex; gap: 10px; overflow-x: auto; padding: 5px 0 15px; scrollbar-width: none; }
  .day-chip {
    min-width: 55px; padding: 10px; border-radius: 15px;
    background: white; border: 1px solid var(--rose-light);
    text-align: center; cursor: pointer; flex-shrink: 0;
  }
  .day-chip.active { background: var(--rose-deep); color: white; border-color: var(--rose-deep); }

  .task-item { display: flex; align-items: center; gap: 12px; padding: 12px; background: white; border-radius: 12px; margin-bottom: 8px; border: 1px solid #f0f0f0; }
  .task-item.done { opacity: 0.5; text-decoration: line-through; }
  
  .btn-add { background: var(--rose-deep); color: white; border: none; border-radius: 12px; padding: 10px 18px; cursor: pointer; font-weight: bold; }

  nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--white); border-top: 1px solid var(--rose-light);
    display: flex; padding: 10px 0 calc(10px + env(safe-area-inset-bottom));
    z-index: 100;
  }
  .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; background: none; border: none; color: var(--text-light); font-size: 0.75rem; gap: 4px; }
  .nav-btn.active { color: var(--rose-deep); }
  .nav-btn svg { width: 24px; height: 24px; }

  #toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: white; padding: 12px 25px; border-radius: 30px;
    font-size: 0.9rem; opacity: 0; transition: 0.4s; z-index: 2000; pointer-events: none;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2); text-align: center;
  }
</style>
</head>
<body>

<header>
  <div class="header-brand">☀️ Mi Agenda</div>
  <div class="header-date" id="headerDate"></div>
</header>

<main>
  <section class="section active" id="sec-home">
    <div class="card">
      <div class="card-title">Agradecimiento del día 🌿</div>
      <textarea class="note-area" id="gratitude" placeholder="Hoy agradezco por..." rows="3"></textarea>
    </div>

    <div class="card">
      <div class="card-title">¿Cómo te sientes?</div>
      <div class="mood-row">
        <button class="mood-btn" onclick="setMood('😊', this)">😊</button>
        <button class="mood-btn" onclick="setMood('✨', this)">✨</button>
        <button class="mood-btn" onclick="setMood('🌿', this)">🌿</button>
        <button class="mood-btn" onclick="setMood('☁️', this)">☁️</button>
        <button class="mood-btn" onclick="setMood('😴', this)">😴</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Resumen de la semana</div>
      <div id="weekSummary" style="font-size: 0.95rem; color: var(--text); line-height: 1.6;">
        Calculando tus progresos...
      </div>
    </div>
  </section>

  <section class="section" id="sec-week">
    <div class="days-strip" id="daysStrip"></div>
    <div class="card">
      <div class="card-title" id="selectedDayTitle">Tareas</div>
      <div style="display:flex; gap:8px; margin-bottom:15px;">
        <input type="text" class="note-area" id="taskInput" placeholder="Nueva tarea..." style="padding: 10px;">
        <button class="btn-add" onclick="addTask()">+</button>
      </div>
      <div id="taskList"></div>
    </div>
  </section>

  <section class="section" id="sec-alerts">
    <div class="card">
      <div class="card-title">Configurar Recordatorio 🔔</div>
      <div style="display:flex; flex-direction:column; gap:12px;">
        <input type="time" id="alertTime" class="note-area" style="padding:10px;">
        <input type="text" id="alertText" class="note-area" placeholder="¿Qué quieres recordar?" style="padding:10px;">
        <button class="btn-add" onclick="addAlert()" style="padding:15px;">Guardar Alerta</button>
      </div>
    </div>
    <div id="alertList"></div>
  </section>
</main>

<nav>
  <button class="nav-btn active" onclick="switchTab('home', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    Inicio
  </button>
  <button class="nav-btn" onclick="switchTab('week', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18"/></svg>
    Semana
  </button>
  <button class="nav-btn" onclick="switchTab('alerts', this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
    Alertas
  </button>
</nav>

<div id="toast"></div>

<script>
// ESTADO Y CARGA
let state = {
  tasks: {},
  moods: {},
  gratitude: {},
  alerts: []
};

const TODAY = new Date().toISOString().split('T')[0];
let selectedDay = TODAY;

function save() { localStorage.setItem('mi_agenda_data', JSON.stringify(state)); updateSummary(); }
function load() {
  const saved = localStorage.getItem('mi_agenda_data');
  if(saved) state = JSON.parse(saved);
}

// INICIALIZACIÓN
function init() {
  load();
  renderDate();
  renderWeekStrip();
  renderTasks();
  renderAlerts();
  updateSummary();
  
  document.getElementById('gratitude').value = state.gratitude[TODAY] || "";
  document.getElementById('gratitude').oninput = (e) => {
    state.gratitude[TODAY] = e.target.value;
    save();
  };

  // Verificar alertas cada minuto
  setInterval(checkAlerts, 30000);
}

function renderDate() {
  const options = { weekday: 'long', day: 'numeric', month: 'long' };
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('es-ES', options);
}

function updateSummary() {
  const last7Days = Array.from({length: 7}, (_, i) => {
    const d = new Date();
    d.setDate(d.getDate() - i);
    return d.toISOString().split('T')[0];
  });

  const thanksCount = last7Days.filter(day => state.gratitude[day] && state.gratitude[day].length > 2).length;
  
  let totalTasks = 0;
  let completedTasks = 0;
  last7Days.forEach(day => {
    if(state.tasks[day]) {
      totalTasks += state.tasks[day].length;
      completedTasks += state.tasks[day].filter(t => t.done).length;
    }
  });

  const summaryHTML = `
    ✨ Has agradecido <b>${thanksCount} de los últimos 7 días</b>.<br>
    ✅ Has completado <b>${completedTasks} tareas</b> esta semana.<br>
    ${thanksCount >= 5 ? '🌟 ¡Qué buena racha de gratitud!' : '🌿 Sigue así, cada día cuenta.'}
  `;
  document.getElementById('weekSummary').innerHTML = summaryHTML;
}

// GESTIÓN DE TAREAS
function renderWeekStrip() {
  const strip = document.getElementById('daysStrip');
  strip.innerHTML = '';
  for(let i = -2; i < 5; i++) {
    const d = new Date();
    d.setDate(d.getDate() + i);
    const k = d.toISOString().split('T')[0];
    const chip = document.createElement('div');
    chip.className = `day-chip ${k === selectedDay ? 'active' : ''}`;
    chip.innerHTML = `<div style="font-size:0.7rem">${d.toLocaleDateString('es-ES', {weekday:'short'})}</div><div>${d.getDate()}</div>`;
    chip.onclick = () => { selectedDay = k; renderWeekStrip(); renderTasks(); };
    strip.appendChild(chip);
  }
}

function addTask() {
  const input = document.getElementById('taskInput');
  if(!input.value.trim()) return;
  if(!state.tasks[selectedDay]) state.tasks[selectedDay] = [];
  state.tasks[selectedDay].push({ id: Date.now(), text: input.value, done: false });
  input.value = '';
  save(); renderTasks();
}

function renderTasks() {
  const list = document.getElementById('taskList');
  const dayTasks = state.tasks[selectedDay] || [];
  document.getElementById('selectedDayTitle').textContent = selectedDay === TODAY ? "Tareas de hoy" : "Tareas seleccionadas";
  list.innerHTML = dayTasks.length ? dayTasks.map(t => `
    <div class="task-item ${t.done ? 'done' : ''}">
      <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id})">
      <span style="flex:1">${t.text}</span>
      <span onclick="deleteTask(${t.id})" style="cursor:pointer; color:var(--rose-deep)">✕</span>
    </div>
  `).join('') : '<p style="color:#aaa; text-align:center; padding:20px;">No hay tareas</p>';
}

function toggleTask(id) {
  state.tasks[selectedDay] = state.tasks[selectedDay].map(t => t.id === id ? {...t, done: !t.done} : t);
  save(); renderTasks();
}

function deleteTask(id) {
  state.tasks[selectedDay] = state.tasks[selectedDay].filter(t => t.id !== id);
  save(); renderTasks();
}

// ALERTAS Y SONIDO
function addAlert() {
  const time = document.getElementById('alertTime').value;
  const text = document.getElementById('alertText').value;
  if(!time || !text) return;
  state.alerts.push({ id: Date.now(), time, text, active: true });
  document.getElementById('alertTime').value = "";
  document.getElementById('alertText').value = "";
  save(); renderAlerts();
  showToast("🔔 Alerta guardada");
}

function renderAlerts() {
  const list = document.getElementById('alertList');
  list.innerHTML = state.alerts.map(a => `
    <div class="card" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div><b>${a.time}</b> - ${a.text}</div>
      <button onclick="deleteAlert(${a.id})" style="background:none; border:none; color:var(--rose-deep); font-size:1.2rem;">✕</button>
    </div>
  `).join('');
}

function deleteAlert(id) {
  state.alerts = state.alerts.filter(a => a.id !== id);
  save(); renderAlerts();
}

function playBeep() {
  const context = new (window.AudioContext || window.webkitAudioContext)();
  const osc = context.createOscillator();
  const gain = context.createGain();
  osc.connect(gain);
  gain.connect(context.destination);
  osc.type = 'sine';
  osc.frequency.setValueAtTime(880, context.currentTime); // Nota La
  gain.gain.setValueAtTime(0, context.currentTime);
  gain.gain.linearRampToValueAtTime(0.5, context.currentTime + 0.1);
  gain.gain.linearRampToValueAtTime(0, context.currentTime + 0.5);
  osc.start();
  osc.stop(context.currentTime + 0.6);
}

function checkAlerts() {
  const now = new Date();
  const currentTime = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
  
  state.alerts.forEach((alert, index) => {
    if(alert.active && alert.time === currentTime) {
      playBeep();
      showToast("📢 RECORDATORIO: " + alert.text);
      alert.active = false; // Desactivar para que no suene cada 30 seg
      save();
    }
  });
}

// UI HELPERS
function setMood(emoji, btn) {
  state.moods[TODAY] = emoji;
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  save();
}

function switchTab(tab, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec-' + tab).classList.add('active');
  btn.classList.add('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = msg; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 4000);
}

window.onload = init;
</script>

</body>
</html>
